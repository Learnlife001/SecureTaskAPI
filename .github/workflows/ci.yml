name: SecureTaskAPI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: securetask_test
          POSTGRES_USER: securetask
          POSTGRES_PASSWORD: securetask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securetask -d securetask_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECURETASK_DATABASE_URL: postgresql+psycopg://securetask:securetask@localhost:5432/securetask_test
      SECURETASK_SECRET_KEY: ci-test-secret-at-least-16-characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          alembic upgrade head
          pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Check formatting
        run: black --check app tests

      - name: Build Docker image
        run: |
          docker build -t securetaskapi .
