services:
  db:
    image: postgres:16
    container_name: securetask_db
    restart: always
    env_file:
      - ${ENV_FILE:-.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - securetask_network
  
  api:
    build: .
    container_name: securetask_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "8000:8000"
    networks:
      - securetask_network

volumes:
  postgres_data:

networks:
  securetask_network:

